const renderSpeechTimeline = (target, vision) => {
  // Older installed Android builds expose only latestTranscript in the vision state. Read the
  // persisted life-log as well so finalized utterances stay visible instead of being replaced.
  const savedRecords = nativeLifeLogRecords(localDay()).map((record) => ({
    id: record.client_record_id,
    text: record.text,
    spokenAt: record.spoken_at,
  }));
  const liveRecords = Array.isArray(vision.transcripts) ? vision.transcripts : [];
  const recordsById = new Map();
  [...savedRecords, ...liveRecords].forEach((record) => {
    const text = String(record.text || '').trim();
    if (!text) return;
    const id = record.id || record.client_record_id || `${record.spokenAt || record.spoken_at}:${text}`;
    recordsById.set(id, { id, text, spokenAt: record.spokenAt || record.spoken_at });
  });
  const records = [...recordsById.values()]
    .sort((a, b) => new Date(a.spokenAt).getTime() - new Date(b.spokenAt).getTime())
    .slice(-50);
  const latest = String(vision.latestTranscript || '').trim();
  const lastFinal = String(records.at(-1)?.text || '').trim();
  const items = records.map((record) => ({
    id: record.id,
    text: record.text,
    spokenAt: record.spokenAt,
    partial: false,
  })).filter((record) => record.text);
  if (latest && latest !== lastFinal) {
    items.push({ id: 'partial', text: latest, spokenAt: Date.now(), partial: true });
  } else if (!items.length && latest) {
    items.push({ id: 'latest', text: latest, spokenAt: Date.now(), partial: false });
  }
  const signature = items.map((item) => `${item.id}:${item.text}`).join('|');
  if (target.dataset.signature === signature) return;
  target.dataset.signature = signature;
  target.innerHTML = items.length
    ? items.map((item) => `<article class="speech-log-entry${item.partial ? ' partial' : ''}"><p>${esc(item.text)}</p></article>`).join('')
    : `<p class="speech-log-empty">${WAVE_ART}마이크를 켜면 대화가 시간순으로 표시됩니다.</p>`;
  target.scrollTop = target.scrollHeight;
};
function refreshVisionState() {
  try {
    // Avoid a native bridge round trip while the current page has no live data.
    const isLifeLogPage = page === 'lifelog';
    const gesture = document.querySelector('#gesture-name');
    const confidence = document.querySelector('#gesture-confidence');
    const session = document.querySelector('#session-toggle');
    const sessionState = document.querySelector('#session-state');
    const transcript = document.querySelector('#speech-caption');
    if (!isLifeLogPage && !gesture && !confidence && !session && !sessionState && !transcript) return;

    const bridge = window.NativeBridge;
    if (!bridge?.getVisionState) return;
    const vision = JSON.parse(bridge.getVisionState());
    if (isLifeLogPage) {
      window.handleNativeLifeLogUpdate?.(vision);
      return;
    }
    const gestureText = vision.isGestureActive ? vision.gestureName : '연결 대기 중';
    const confidenceText = vision.isGestureActive ? `인식 신뢰도 ${vision.gestureConfidence}%` : '글래스 스트림 연결 시 자동 시작';
    if (gesture && gesture.textContent !== gestureText) gesture.textContent = gestureText;
    if (confidence && confidence.textContent !== confidenceText) confidence.textContent = confidenceText;
    const streamReady = vision.isGestureActive;
    if (session) {
      const disabled = !streamReady;
      const sessionText = !streamReady ? '연결 대기' : (vision.isSessionEnabled ? '세션 끄기' : '세션 켜기');
      if (session.disabled !== disabled) session.disabled = disabled;
      if (session.textContent !== sessionText) session.textContent = sessionText;
    }
    if (sessionState) {
      const stateText = !streamReady ? '대기 중 · 글래스 스트림 연결 필요' : (vision.isSessionEnabled ? (vision.isMicrophoneOn ? '켜져있음 · 카메라 · STT 기록 중' : '켜져있음 · 마이크 준비 중') : '꺼져있음 · 카메라 · STT 대기');

  } catch (_) {}
}

  window.addEventListener('resize', window.lifeLensFitHome, { passive: true });
  refreshVisionState();
}

function iot() {
  content.innerHTML = `<section class="hero mini-hero" style="--i:0"><div class="hero-text"><span class="hero-kicker">MATTER BRIDGE</span><h2>IoT 제어</h2><p>Matter 브릿지에 연결된 조명·플러그를 제어합니다. 손 제스처로도 같이 동작해요.</p><div class="actions"><button class="primary" id="add-matter">+ 기기 추가</button></div></div>${PAGE_ART.iot}</section><section class="card grow" style="--i:1"><div class="panel-heading"><div><span class="section-label">MY DEVICES</span><h2>연결된 기기</h2></div><span class="date-pill">${esc(displayServerAddress(iotServer))}</span></div><div id="matter-devices" class="matter-devices"><p class="empty">기기를 불러오는 중…</p></div></section>`;
  const draw = async () => {
    let devices = [];
    try { devices = await matterCommand('get_nodes', { only_available: false }); } catch (error) {
      // The bridge can answer long after the user has moved on.
      const slot = $('#matter-devices');
      if (slot) slot.innerHTML = `<p class="empty">${EMPTY_ART}<span>${esc(error.message)}<br>Debug에서 서버 주소와 Matter 서버 실행 상태를 확인하세요.</span></p>`;
      return;
    }
    if (!$('#matter-devices')) return;
    $('#matter-devices').innerHTML = devices.length ? devices.map((device, index) => {
      const attrs = device.attributes || {};
      const name = attrs['0/40/5'] || attrs['0/40/3'] || `Matter 기기 ${device.node_id}`;
      const visual = matterVisualState.get(String(device.node_id)) || {};
      const isOn = typeof visual.isOn === 'boolean' ? visual.isOn : attrs['1/6/0'] === true;
      const level = Number.isFinite(visual.level) ? visual.level : (Number.isFinite(attrs['1/8/0']) ? attrs['1/8/0'] : 254);
      const brightness = Math.round(level / 254 * 100);
      const hasLevel = Object.prototype.hasOwnProperty.call(attrs, '1/8/0');
      const hasColor = Object.prototype.hasOwnProperty.call(attrs, '1/768/0');
      const lightControls = (hasLevel || hasColor) ? `<div class="light-controls ${isOn ? '' : 'disabled'}">${hasLevel ? `<label class="brightness-control"><span>밝기</span><input type="range" min="1" max="254" value="${level}" data-action="brightness" data-id="${esc(device.node_id)}" ${isOn ? '' : 'disabled'}><output>${brightness}%</output></label>` : ''}${hasColor ? `<div class="color-control"><span>색상</span><div class="color-swatches"><button aria-label="빨강" class="swatch red" data-action="color" data-id="${esc(device.node_id)}" data-hue="0" ${isOn ? '' : 'disabled'}></button><button aria-label="주황" class="swatch orange" data-action="color" data-id="${esc(device.node_id)}" data-hue="21" ${isOn ? '' : 'disabled'}></button><button aria-label="노랑" class="swatch yellow" data-action="color" data-id="${esc(device.node_id)}" data-hue="42" ${isOn ? '' : 'disabled'}></button><button aria-label="초록" class="swatch green" data-action="color" data-id="${esc(device.node_id)}" data-hue="85" ${isOn ? '' : 'disabled'}></button><button aria-label="파랑" class="swatch blue" data-action="color" data-id="${esc(device.node_id)}" data-hue="170" ${isOn ? '' : 'disabled'}></button><button aria-label="보라" class="swatch purple" data-action="color" data-id="${esc(device.node_id)}" data-hue="213" ${isOn ? '' : 'disabled'}></button></div></div>` : ''}</div>` : '';
      return `<article class="matter-device" style="--i:${index}"><div><b>${esc(name)}</b><small>${device.available ? (isOn ? '켜져있음' : '꺼져있음') : '오프라인'} · ID ${esc(device.node_id)}</small></div><div class="matter-actions"><button class="control-button ${isOn ? 'active' : ''}" data-action="toggle" data-id="${esc(device.node_id)}" data-state="${isOn}">${isOn ? '끄기' : '켜기'}</button><button class="icon-button" data-action="edit" data-id="${esc(device.node_id)}" data-name="${esc(name)}">수정</button></div>${lightControls}</article>`;
    }).join('') : `<p class="empty">${EMPTY_ART}<span>등록된 Matter 기기가 없습니다.<br>기기 추가에서 QR 코드 또는 설정 코드를 입력하세요.</span></p>`;
    document.querySelectorAll('.matter-device button').forEach((button) => button.onclick = async () => {
      const nodeId = button.dataset.id;
      try {
        if (button.dataset.action === 'toggle') {
          const previous = matterVisualState.get(String(nodeId));
          matterVisualState.set(String(nodeId), { ...previous, isOn: button.dataset.state !== 'true' });
          await matterCommand('device_command', { node_id: Number(nodeId), endpoint_id: 1, cluster_id: 6, command_name: button.dataset.state === 'true' ? 'Off' : 'On', payload: {}, response_type: null });
        }
        if (button.dataset.action === 'edit') {
          const name = await askText('기기 이름 변경', '새 이름을 입력하면 Matter 기기에 저장됩니다.', button.dataset.name, '거실 조명');
          if (name?.trim()) await matterCommand('write_attribute', { node_id: Number(nodeId), attribute_path: '0/40/5', value: name.trim() });
        }
        if (button.dataset.action === 'color') await matterCommand('device_command', { node_id: Number(nodeId), endpoint_id: 1, cluster_id: 768, command_name: 'MoveToHueAndSaturation', payload: { hue: Number(button.dataset.hue), saturation: 254, transitionTime: 0, optionsMask: {}, optionsOverride: {} }, response_type: null });
        await draw();
      } catch (error) { toast(error.message || 'Matter 요청에 실패했습니다.', 'error'); }
    });
    document.querySelectorAll('.brightness-control input').forEach((input) => {
      input.oninput = () => input.parentElement.querySelector('output').textContent = `${Math.round(Number(input.value) / 254 * 100)}%`;
      input.onchange = async () => {
        const nodeId = String(input.dataset.id);
        const previous = matterVisualState.get(nodeId);
        matterVisualState.set(nodeId, { ...previous, level: Number(input.value) });
        try { await matterCommand('device_command', { node_id: Number(nodeId), endpoint_id: 1, cluster_id: 8, command_name: 'MoveToLevelWithOnOff', payload: { level: Number(input.value), transitionTime: 0, optionsMask: {}, optionsOverride: {} }, response_type: null }); }
        catch (error) { if (previous) matterVisualState.set(nodeId, previous); else matterVisualState.delete(nodeId); await draw(); toast(error.message || '밝기 변경에 실패했습니다.', 'error'); }
      };
    });
  };
  $('#add-matter').onclick = async () => {
    const code = await askText('Matter 기기 추가', 'QR 코드 또는 11자리 설정 코드를 입력하세요.', '', 'MT:... 또는 12345678901');
    if (!code?.trim()) return;
    toast('기기를 찾고 있습니다… 최대 5분 걸릴 수 있어요.');
    try { await matterCommand('commission_with_code', { code: code.trim(), network_only: true }, 300000); toast('기기를 추가했습니다.', 'ok'); await draw(); }
    catch (error) { toast(error.message || 'Matter 기기 추가에 실패했습니다.', 'error'); }
  };
  draw();
}

async function lifeLog() {
  let day = localDay();
  let calendarMonth = new Date(`${day}T12:00:00`);
  const dayLabel = (value) => new Date(`${value}T12:00:00`).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });
  const toDay = (value) => `${value.getFullYear()}-${String(value.getMonth() + 1).padStart(2, '0')}-${String(value.getDate()).padStart(2, '0')}`;
  content.innerHTML = `<section class="hero mini-hero" style="--i:0"><div class="hero-text"><span class="hero-kicker">DAILY MEMORY</span><h2>라이프로그</h2><p id="lifelog-date">${dayLabel(day)} · 대화 기록을 다시 살펴보세요.</p><div class="actions"><button class="primary" id="summarize">✦ 일기 작성</button><button class="glass-button" id="open-calendar">▦ 날짜 선택</button></div></div>${PAGE_ART.lifelog}</section><section class="card lifelog-timeline-card" style="--i:1"><div class="panel-heading"><div><span class="section-label" id="lifelog-section-label">STT TIMELINE</span><h2 id="lifelog-panel-title">대화 원문</h2></div><div class="log-toggle compact" role="tablist"><button class="active" data-log-view="records">대화 원문</button><button data-log-view="report">리포트 보기</button></div></div><div id="records" class="timeline">불러오는 중…</div></section><section class="photo-viewer" id="lifelog-photo-viewer" hidden><button class="photo-viewer-close" id="photo-viewer-close" aria-label="닫기">×</button><img id="photo-viewer-image" alt="라이프로그 사진"><p id="photo-viewer-meta"></p></section><dialog class="calendar-dialog" id="lifelog-calendar"><section class="calendar-sheet"><div class="calendar-heading"><div><span class="section-label">LIFELOG CALENDAR</span><h2 id="calendar-month"></h2></div><button class="calendar-close" id="calendar-close" aria-label="닫기">×</button></div><div class="calendar-weekdays"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span></div><div class="calendar-days" id="calendar-days"></div><div class="calendar-actions"><button class="glass-action" id="calendar-prev">이전 달</button><button class="primary" id="calendar-today">오늘</button><button class="glass-action" id="calendar-next">다음 달</button></div></section></dialog>`;
  let currentLog = null;
  let logView = 'records';
  let isGenerating = false;
  let loadRequestId = 0;
  let lastPhotoRevision = 0;
  try {
    lastPhotoRevision = Number(JSON.parse(window.NativeBridge?.getVisionState?.() || '{}').photoRevision || 0);
  } catch (_) {}
  const photoMeta = (photo) => {
    const time = new Date(photo.taken_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    const location = photoLocation(photo);
    return `${time} · ${location}${photo.vision_caption ? `\n${photo.vision_caption}` : ''}`;
  };
  const photoLocation = (photo) => {
    if (photo.location_name) return photo.location_name;
    return Number.isFinite(Number(photo.latitude)) && Number.isFinite(Number(photo.longitude))
      ? `${Number(photo.latitude).toFixed(5)}, ${Number(photo.longitude).toFixed(5)}`
      : '위치 정보 없음';
  };
  // A LifeLog can contain many full-resolution photos. Do not decode every
  // original before showing the page: the thumbnail is enough for the list,
  // and the original is fetched only after the user opens that photo.
  const photoSource = (photo) => photo.loaded_url || photo.url || `data:image/jpeg;base64,${esc(photo.thumbnail || '')}`;
  const photoThumbnailSource = (photo) => photo.thumbnail ? `data:image/jpeg;base64,${esc(photo.thumbnail)}` : photoSource(photo);
  const photoThumb = (photo, index, kind = '') => `<button class="photo-thumb ${kind}" data-photo-index="${index}"><img src="${photoThumbnailSource(photo)}" alt="촬영 사진" loading="lazy" decoding="async"><span>${esc(photoLocation(photo))}</span></button>`;
  const timelineItems = () => {
    const groups = timelineGroups(currentLog?.records);
    return [
      ...groups.map((group) => ({ ...group, type: 'text', timelineKey: `text:${group.key}` })),
      ...(currentLog?.photos || []).map((photo, index) => ({
        type: 'photo',
        photo,
        index,
        timelineKey: `photo:${photo.client_photo_id || photo.uri || photo.taken_at}`,
        time: new Date(photo.taken_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }),
        stamp: new Date(photo.taken_at).getTime(),
      })),
    ].sort((a, b) => (a.stamp || 0) - (b.stamp || 0));
  };
  const timelineItemHtml = (item, order) => item.type === 'photo'
    ? `<article class="record photo-timeline-record" data-timeline-key="${esc(item.timelineKey)}" style="--i:${order}"><time>${esc(item.time)}</time>${photoThumb(item.photo, item.index, 'timeline-photo')}</article>`
    : `<article class="record" data-timeline-key="${esc(item.timelineKey)}" style="--i:${order}"><p>${item.texts.map((text) => esc(text)).join('<br>')}</p></article>`;
  const bindPhotoClicks = () => document.querySelectorAll('[data-photo-index]').forEach((button) => button.onclick = () => {
    const photo = currentLog?.photos?.[Number(button.dataset.photoIndex)];
    if (!photo) return;
    // Android uses a native photo screen. Browsers keep the web full-screen viewer.
    if (window.NativeBridge?.openPhotoViewer?.(photo.url || '', photo.uri || '')) return;
    const viewer = $('#lifelog-photo-viewer');
    const image = $('#photo-viewer-image');
    // The thumbnail is already decoded by WebView. Render it first so a failed original request
    // never leaves a blank full-screen viewer.
    const thumbnail = button.querySelector('img')?.currentSrc || photoSource(photo);
    const full = photo.loaded_url || photo.url || '';
    $('#photo-viewer-meta').textContent = photoMeta(photo);
    image.onerror = () => { image.onerror = null; image.src = thumbnail; };
    image.src = thumbnail;
    if (full && full !== thumbnail) {
      const fullImage = new Image();
      fullImage.onload = () => { if (!viewer.hidden) image.src = fullImage.src; };
      fullImage.src = full;
    }
    viewer.hidden = false;
    document.body.classList.add('photo-viewer-open');
  });
  const appendTimelineChanges = () => {
    const target = $('#records');
    if (logView !== 'records' || !target || !currentLog) return;
    const distanceFromBottom = target.scrollHeight - target.scrollTop - target.clientHeight;
    const keepPinnedToBottom = distanceFromBottom < 72;
    target.querySelector('.empty')?.remove();
    target.querySelector('[data-live-partial]')?.remove();
    const existingByKey = new Map(
      [...target.querySelectorAll('[data-timeline-key]')]
        .map((entry) => [entry.dataset.timelineKey, entry]),
    );
    timelineItems().forEach((item, order) => {
      const existing = existingByKey.get(item.timelineKey);
      if (!existing) {
        target.insertAdjacentHTML('beforeend', timelineItemHtml(item, order));
        return;
      }
      // More STT can be finalized inside the same minute group. Update only that article.
      if (item.type === 'text') {
        const paragraph = existing.querySelector('p');
        const nextText = item.texts.join('\n');
        if (paragraph?.innerText !== nextText) paragraph.innerHTML = item.texts.map((text) => esc(text)).join('<br>');
      } else {
        const button = existing.querySelector('[data-photo-index]');
        if (button) button.dataset.photoIndex = String(item.index);
      }
    });
    bindPhotoClicks();
    if (keepPinnedToBottom) requestAnimationFrame(() => { target.scrollTop = target.scrollHeight; });
  };
  const renderPanel = () => {
    const target = $('#records');
    const title = $('#lifelog-panel-title');
    const label = $('#lifelog-section-label');
    // The LifeLog page may already be gone when a slow request finally lands.
    if (!target || !title || !label) return;
    label.textContent = logView === 'report' ? 'LIFELOG' : 'STT TIMELINE';
    document.querySelectorAll('[data-log-view]').forEach((button) => button.classList.toggle('active', button.dataset.logView === logView));
    if (isGenerating) {
      title.textContent = '리포트 생성 중';
      target.className = 'report-loading';
      target.innerHTML = '<span class="spinner"></span><p>대화·사진·위치 정보를 분석하고 있습니다…</p>';
      return;
    }
    if (logView === 'records') {
      title.textContent = '대화 원문';
      target.className = 'timeline';
      // Live STT refreshes this list in place. Preserve the position selected by the user rather
      // than snapping it to the newest entry while they are reading older records.
      const previousScrollTop = target.scrollTop;
      const items = timelineItems();
      target.innerHTML = items.length ? items.map(timelineItemHtml).join('') : `<p class="empty">${EMPTY_ART}<span>아직 기록된 대화나 사진이 없습니다.</span></p>`;
      bindPhotoClicks();
      requestAnimationFrame(() => { target.scrollTop = previousScrollTop; });
      return;
    }
    title.textContent = '오늘의 리포트';
    target.className = 'report-view';
    const summary = currentLog?.summary;
    target.innerHTML = summary ? `<article class="markdown-report">${renderMarkdown(summary.summary)}</article>${summary.keywords?.length ? `<div class="report-group"><b>핵심 키워드</b><div class="report-tags">${summary.keywords.map((keyword, order) => `<span style="--i:${order}">${esc(keyword)}</span>`).join('')}</div></div>` : ''}${summary.todos?.length ? `<div class="report-group"><b>할 일</b><ul>${summary.todos.map((todo) => `<li>${esc(todo)}</li>`).join('')}</ul></div>` : ''}${currentLog?.photos?.length ? `<div class="report-photo-group"><b>오늘의 사진</b><div class="photo-carousel">${currentLog.photos.map((photo, index) => photoThumb(photo, index, 'report-photo')).join('')}</div></div>` : ''}<div class="report-share-row"><button class="glass-action report-share" id="share-report">↗ SNS 공유</button></div>` : `<p class="empty">${EMPTY_ART}<span>아직 생성된 리포트가 없습니다.<br>일기 작성을 눌러 만들어 보세요.</span></p>`;
    bindPhotoClicks();
    $('#share-report')?.addEventListener('click', async () => {
      const text = `LifeLens 리포트 · ${dayLabel(day)}\n\n${summary.summary}`;
      if (window.NativeBridge?.shareText?.('LifeLens 리포트', text)) return;
      if (navigator.share) return navigator.share({ title: 'LifeLens 리포트', text });
      await navigator.clipboard?.writeText(text);
      toast('리포트를 클립보드에 복사했습니다.', 'ok');
    });
  };
  const draw = async () => {
    const selectedDay = day;
    const requestId = ++loadRequestId;
    const target = $('#records');
    if (!target) return;
    target.className = 'timeline';
    target.innerHTML = '<p class="empty">기록을 불러오는 중…</p>';
    const localRecords = nativeLifeLogRecords(selectedDay);
    const localPhotos = nativeLifeLogPhotos(selectedDay);
    try {
      await syncLifeLogRecords(selectedDay, localRecords);
      const response = await api(`/v1/lifelogs/${encodeURIComponent(sharedLifeLogId)}/${selectedDay}`);
      if (requestId !== loadRequestId || selectedDay !== day) return;
      const serverRecords = (response.records || []).filter((record) => dayFromTimestamp(record.spoken_at) === selectedDay);
      const serverPhotos = (response.photos || []).filter((photo) => dayFromTimestamp(photo.taken_at) === selectedDay);
      serverPhotos.forEach((photo) => { if (photo.url && !/^https?:/i.test(photo.url)) photo.url = apiUrl(photo.url); });
      const recordsForDay = localRecords.filter((record) => dayFromTimestamp(record.spoken_at) === selectedDay);
      const photosForDay = localPhotos.filter((photo) => dayFromTimestamp(photo.taken_at) === selectedDay);
      const allRecords = [...serverRecords, ...recordsForDay.filter((record) => !serverRecords.some((serverRecord) => serverRecord.client_record_id === record.client_record_id))].sort((a, b) => new Date(a.spoken_at) - new Date(b.spoken_at));
      const allPhotos = [...serverPhotos, ...photosForDay.filter((photo) => !serverPhotos.some((serverPhoto) => serverPhoto.client_photo_id === photo.client_photo_id))].sort((a, b) => new Date(a.taken_at) - new Date(b.taken_at));
      if (requestId !== loadRequestId || selectedDay !== day) return;
      currentLog = { ...response, records: allRecords, localRecords, photos: allPhotos };
    } catch {
      if (requestId !== loadRequestId || selectedDay !== day) return;
      currentLog = { records: localRecords, localRecords, photos: localPhotos, summary: null };
    }
    if (requestId !== loadRequestId || selectedDay !== day) return;
    renderPanel();
  };
  const renderCalendar = () => {
    const year = calendarMonth.getFullYear();
    const month = calendarMonth.getMonth();
    $('#calendar-month').textContent = `${year}년 ${month + 1}월`;
    const first = new Date(year, month, 1).getDay();
    const last = new Date(year, month + 1, 0).getDate();
    const days = Array.from({ length: first + last }, (_, index) => {
      if (index < first) return '<span class="calendar-blank"></span>';
      const value = new Date(year, month, index - first + 1);
      const valueDay = toDay(value);
      const future = valueDay > localDay();
      return `<button class="calendar-day ${valueDay === day ? 'selected' : ''} ${valueDay === localDay() ? 'today' : ''}" data-day="${valueDay}" ${future ? 'disabled' : ''}>${value.getDate()}</button>`;
    }).join('');
    $('#calendar-days').innerHTML = days;
    document.querySelectorAll('.calendar-day').forEach((button) => button.onclick = () => {
      day = button.dataset.day;
      $('#lifelog-date').textContent = `${dayLabel(day)} · 대화 기록을 다시 살펴보세요.`;
      $('#lifelog-calendar').close();
      draw();
    });
  };
  $('#open-calendar').onclick = () => { renderCalendar(); $('#lifelog-calendar').showModal(); };
  $('#calendar-close').onclick = () => $('#lifelog-calendar').close();
  const closePhotoViewer = () => {
    $('#lifelog-photo-viewer').hidden = true;
    $('#photo-viewer-image').removeAttribute('src');
    document.body.classList.remove('photo-viewer-open');
  };
  $('#photo-viewer-close').onclick = closePhotoViewer;
  $('#lifelog-photo-viewer').onclick = (event) => { if (event.target === event.currentTarget) closePhotoViewer(); };
  $('#calendar-prev').onclick = () => { calendarMonth = new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() - 1, 1); renderCalendar(); };
  $('#calendar-next').onclick = () => { calendarMonth = new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() + 1, 1); renderCalendar(); };
  $('#calendar-today').onclick = () => { calendarMonth = new Date(); day = localDay(); $('#lifelog-date').textContent = `${dayLabel(day)} · 대화 기록을 다시 살펴보세요.`; $('#lifelog-calendar').close(); draw(); };
  document.querySelectorAll('[data-log-view]').forEach((button) => button.onclick = () => { logView = button.dataset.logView; renderPanel(); });
  $('#summarize').onclick = async () => {
    if (!currentLog?.records?.length && !currentLog?.photos?.length) return toast('요약할 STT 기록이나 사진이 없습니다.', 'error');
    const button = $('#summarize'); button.disabled = true; button.textContent = '요약 생성 중…'; logView = 'report'; isGenerating = true; renderPanel();
    try {
      await api('/v1/lifelogs/summarize', { method: 'POST', body: JSON.stringify({ device_id: sharedLifeLogId, date: day, records: currentLog.records }) });
      isGenerating = false;
      await draw();
    } catch (error) {
      isGenerating = false;
      renderPanel();
      const detail = String(error?.message || '알 수 없는 오류').replace(/<[^>]*>/g, '').slice(0, 160);
      toast(`요약 생성 실패 · ${detail}`, 'error');
    }
    button.disabled = false; button.textContent = '✦ 일기 작성';
  };
  await draw();

  let finalizedSignature = '';
  window.handleNativeLifeLogUpdate = (vision) => {
    if (page !== 'lifelog' || !currentLog || day !== localDay()) return;
    const nextPhotoRevision = Number(vision.photoRevision || 0);
    if (nextPhotoRevision !== lastPhotoRevision) {
      lastPhotoRevision = nextPhotoRevision;
      const localPhotos = nativeLifeLogPhotos(day)
        .filter((photo) => dayFromTimestamp(photo.taken_at) === day);
      const photosById = new Map((currentLog.photos || [])
        .map((photo) => [photo.client_photo_id, photo]));
      localPhotos.forEach((photo) => {
        const existing = photosById.get(photo.client_photo_id) || {};
        photosById.set(photo.client_photo_id, { ...existing, ...photo });
      });
      currentLog = {
        ...currentLog,
        photos: [...photosById.values()].sort((a, b) => new Date(a.taken_at) - new Date(b.taken_at)),
      };
      appendTimelineChanges();
    }
    const liveRecords = Array.isArray(vision.transcripts) ? vision.transcripts.map((record) => ({
      client_record_id: record.id,
      text: record.text,
      spoken_at: new Date(record.spokenAt).toISOString(),
    })).filter((record) => record.client_record_id && record.text) : [];
    const recordsById = new Map((currentLog.records || [])
      .filter((record) => record.client_record_id !== '__live_partial__')
      .map((record) => [record.client_record_id, record]));
    liveRecords.forEach((record) => recordsById.set(record.client_record_id, record));
    const records = [...recordsById.values()].sort((a, b) => new Date(a.spoken_at) - new Date(b.spoken_at));
    const nextFinalizedSignature = records.map((record) => `${record.client_record_id}:${record.text}`).join('|');
    if (nextFinalizedSignature !== finalizedSignature) {
      finalizedSignature = nextFinalizedSignature;
      currentLog = { ...currentLog, records };
      appendTimelineChanges();
    }

    // Partial recognition changes often. Update only this one DOM node, avoiding a complete
    // timeline rebuild while the user is speaking or scrolling through older records.
    const partial = String(vision.latestTranscript || '').trim();
    const target = $('#records');
    const existing = target?.querySelector('[data-live-partial]');
    if (!partial) { existing?.remove(); return; }
    if (existing) { existing.querySelector('p').textContent = partial; return; }
    if (logView === 'records' && target) {
      const entry = document.createElement('article');
      entry.className = 'record live-partial-record';
      entry.dataset.livePartial = 'true';
      entry.innerHTML = `<time>실시간 입력</time><p>${esc(partial)}</p>`;
      target.appendChild(entry);
    }
  };
  refreshVisionState();
}

function debug() {
  content.innerHTML = `<section class="hero mini-hero" style="--i:0"><div class="hero-text"><span class="hero-kicker">DIAGNOSTICS</span><h2>연결 상태</h2><p>백엔드·Ollama·Matter 브릿지 서버를 점검하고 주소를 바꿉니다.</p></div>${PAGE_ART.debug}</section><button class="card skill featured" id="debug-live" style="--i:1"><span class="icon">${ICONS.stream}</span><div><span class="badge live">LIVE</span><h2>Live Vision</h2><p>글래스 카메라 스트림과 손 제스처를 실시간으로 확인합니다.</p></div><em>→</em></button><section class="card connection-card" style="--i:2"><span class="section-label">BACKEND SERVER</span><h2>LifeLens 백엔드 서버</h2><div class="connection-row"><span class="connection-dot checking" id="backend-dot"></span><p class="muted" id="debug-state">연결 상태 확인 중…</p></div><div class="iot-server-form"><input id="backend-server-input" inputmode="url" autocomplete="off" value="${esc(displayServerAddress(backendServer))}" placeholder="${esc(location.host)} (비우면 현재 주소)"><button class="primary" id="save-backend-server">연결</button></div></section><section class="card connection-card" style="--i:3"><span class="section-label">OLLAMA SERVER</span><h2>Ollama 서버</h2><p class="muted" id="ollama-state">설정 불러오는 중…</p><div class="iot-server-form"><input id="ollama-server-input" inputmode="url" autocomplete="off" value="127.0.0.1:11434" placeholder="127.0.0.1:11434"><button class="primary" id="save-ollama-server">저장</button></div></section><section class="card connection-card" style="--i:4"><span class="section-label">MATTER BRIDGE SERVER</span><h2>IoT 제어 브릿지</h2><div class="connection-row"><span class="connection-dot checking" id="matter-dot"></span><p class="muted" id="matter-state">연결 상태 확인 중…</p></div><div class="iot-server-form"><input id="iot-server-input" inputmode="url" autocomplete="off" value="${esc(displayServerAddress(iotServer))}" placeholder="192.168.3.80:5580"><button class="primary" id="save-iot-server">저장</button></div></section><section class="card stt-test-card" style="--i:5"><span class="section-label">STT TEST</span><h2>STT 기록 테스트</h2><p class="muted">실제 STT처럼 현재 시각의 로컬 라이프로그 타임라인에 추가합니다.</p><textarea id="manual-stt-input" maxlength="4000" placeholder="테스트할 대화 내용을 입력하세요."></textarea><div class="stt-test-actions"><button class="control-button" id="submit-manual-stt">타임라인 추가</button><small class="muted" id="manual-stt-result"></small></div></section>`;
  let gestureSettings = { pinch: false, power: true, presentation: true };
  try {
    gestureSettings = { ...gestureSettings, ...JSON.parse(window.NativeBridge?.getGestureSettings?.() || '{}') };
  } catch (_) {}
  const gestureToggle = (key, title, description) => `<label class="gesture-setting-row"><span><b>${title}</b><small>${description}</small></span><input type="checkbox" data-gesture-setting="${key}" ${gestureSettings[key] ? 'checked' : ''}><i aria-hidden="true"></i></label>`;
  document.querySelector('.stt-test-card')?.insertAdjacentHTML('beforebegin', `<section class="card gesture-settings-card" style="--i:5"><span class="section-label">GESTURE CONTROL</span><h2>제스처 기능 설정</h2><p class="muted">각 제스처 명령을 독립적으로 켜거나 끕니다.</p><div class="gesture-setting-list">${gestureToggle('pinch', '핀치 제스처', '왼손 핀치 촬영 기능')}${gestureToggle('power', 'ON/OFF 제스처', '조명 전원 전환 기능')}${gestureToggle('presentation', '다음/이전 제스처', 'PPT 페이지 이동 기능')}</div><small class="muted" id="gesture-settings-result">설정은 이 휴대폰에 저장됩니다.</small></section>`);
  // Leaving the Debug page discards these nodes; a late response must not reject.
  const setText = (selector, text) => { const node = $(selector); if (node) node.textContent = text; };
  const setDot = (selector, state) => { const node = $(selector); if (node) node.className = `connection-dot ${state}`; };
  const setBackendStatus = (ok, text) => { setDot('#backend-dot', ok ? 'online' : 'offline'); setText('#debug-state', text); };
  $('#debug-live').onclick = openLiveVision;
  const checkMatterBridge = () => {
    setDot('#matter-dot', 'checking'); setText('#matter-state', 'Matter 브릿지 서버 연결 확인 중…');
    matterCommand('server_info', {}, 8000).then((info) => { setDot('#matter-dot', 'online'); setText('#matter-state', `연결됨 · WebSocket · API ${info.schema_version ?? '-'}`); }).catch(() => { setDot('#matter-dot', 'offline'); setText('#matter-state', '연결 안 됨 · 주소와 포트를 확인하세요.'); });
  };
  const checkBackend = () => {
    setDot('#backend-dot', 'checking');
    setText('#debug-state', '연결 상태 확인 중…');
    return fetch(apiUrl('/health'), { cache: 'no-store' })
      .then((response) => response.json())
      .then((data) => {
        setBackendStatus(true, `연결됨 · ${displayServerAddress(backendServer || location.host)} · ${data.model}`);
        return true;
      })
      .catch(() => {
        setBackendStatus(false, '연결 안 됨 · 백엔드 서버 주소를 확인하세요.');
        return false;
      });
  };
  checkBackend();
  $('#save-backend-server').onclick = async () => {
    const button = $('#save-backend-server');
    const typed = $('#backend-server-input').value.trim();
    const next = typed ? normalizeIotServer(typed) : '';
    if (next && !/^https?:\/\/[^/:]+(:\d+)?$/.test(next)) {
      setDot('#backend-dot', 'offline');
      setText('#debug-state', 'IP 주소와 포트 번호를 입력하세요. 예: 192.168.0.10:8080');
      return;
    }
    const previous = backendServer;
    backendServer = next;
    button.disabled = true;
    const ok = await checkBackend();
    button.disabled = false;
    if (!ok) {
      // Never strand the app on an address that does not answer.
      backendServer = previous;
      await checkBackend();
      toast('그 주소에서 응답이 없어 이전 서버로 되돌렸습니다.', 'error');
      return;
    }
    localStorage.setItem('kimchi-backend-server', backendServer);
    $('#backend-server-input').value = displayServerAddress(backendServer);
    toast(backendServer ? '백엔드 서버를 연결했습니다.' : '현재 접속한 주소를 사용합니다.', 'ok');
  };
  api('/v1/settings/ollama').then((settings) => {
    const input = $('#ollama-server-input');
    if (input) input.value = displayServerAddress(settings.ollama_url);
    setText('#ollama-state', `일기 ${settings.ollama_model} · 사진 ${settings.ollama_vision_model}`);
  }).catch(() => setText('#ollama-state', '설정을 불러오지 못했습니다.'));
  checkMatterBridge();
  document.querySelectorAll('[data-gesture-setting]').forEach((toggle) => {
    toggle.onchange = () => {
      const saved = window.NativeBridge?.setGestureEnabled?.(toggle.dataset.gestureSetting, toggle.checked) === true;
      if (!saved) toggle.checked = !toggle.checked;
      setText('#gesture-settings-result', saved ? '설정이 저장되었습니다.' : '앱에서만 변경할 수 있습니다.');
    };
  });
  $('#save-ollama-server').onclick = async () => {
    const button = $('#save-ollama-server');
    const next = normalizeIotServer($('#ollama-server-input').value);
    button.disabled = true;
    $('#ollama-state').textContent = '저장 중…';
    try {
      const settings = await api('/v1/settings/ollama', { method: 'PUT', body: JSON.stringify({ ollama_url: next }) });
      $('#ollama-server-input').value = displayServerAddress(settings.ollama_url);
      $('#ollama-state').textContent = `저장됨 · 일기 ${settings.ollama_model} · 사진 ${settings.ollama_vision_model}`;
    } catch (error) {
      $('#ollama-state').textContent = '주소 형식을 확인하세요. 예: 127.0.0.1:11434';
    } finally { button.disabled = false; }
  };
  $('#save-iot-server').onclick = () => {
    const next = normalizeIotServer($('#iot-server-input').value);
    if (!/^https?:\/\/[^/:]+:\d+$/.test(next)) {
      $('#matter-dot').className = 'connection-dot offline';
      $('#matter-state').textContent = 'IP 주소와 포트 번호를 입력하세요.';
      return;
    }
    iotServer = next;
    localStorage.setItem('kimchi-iot-server', iotServer);
    $('#iot-server-input').value = displayServerAddress(iotServer);
    checkMatterBridge();
  };
  $('#submit-manual-stt').onclick = () => {
    const input = $('#manual-stt-input');
    const text = input.value.trim();
    if (!text) return input.focus();
    const button = $('#submit-manual-stt');
    const stored = window.NativeBridge?.addTestLifeLogRecord?.(text);
    if (stored) {
      input.value = '';
      $('#manual-stt-result').textContent = '타임라인에 추가됨';
    } else {
      $('#manual-stt-result').textContent = '추가 실패 · 앱을 새로고침하세요.';
    }
  };
}

function intro() {
  const header = document.querySelector('.brand-header');
  const nav = document.querySelector('.bottom');
  if (header) header.style.display = 'none';
  if (nav) nav.style.display = 'none';

  // 7 sheets to riffle through, 3 wobbly handwriting strokes per page.
  const sheets = Array.from({ length: 7 }, (_, index) => `<i class="book-sheet" style="--n:${index}"></i>`).join('');
  const scribble = `<svg class="scribble" viewBox="0 0 104 62" aria-hidden="true">
        <path style="--i:0" d="M8 14 q8 -8 16 0 t16 0 t16 0 t16 0"/>
        <path style="--i:1" d="M8 31 q8 -8 16 0 t16 0 t14 0"/>
        <path style="--i:2" d="M8 48 q8 -8 16 0 t16 0 t16 0 t9 0"/>
      </svg>`;

  const splash = document.createElement('div');
  splash.className = 'intro-screen';
  splash.innerHTML = `
    <div class="intro-glow"></div>
    <div class="intro-dots"></div>
    <div class="intro-stage">
      <div class="intro-book">
        <div class="book-half left">${scribble}</div>
        <div class="book-half right">${scribble}</div>
        ${sheets}
        <div class="book-spine"></div>
        <div class="book-ribbon"></div>
      </div>
      <svg class="intro-glasses" viewBox="0 0 268 116" aria-hidden="true">
        <defs>
          <linearGradient id="ll-lens" x1="0" y1="0" x2=".9" y2="1">
            <stop offset="0" stop-color="#ffe7c6"/>
            <stop offset=".48" stop-color="#c2efe2"/>
            <stop offset="1" stop-color="#cfe4ff"/>
          </linearGradient>
        </defs>
        <g class="glass-sticker" fill="none" stroke="#fffdf6" stroke-width="19" stroke-linecap="round" stroke-linejoin="round">
          <rect x="30" y="34" width="88" height="58" rx="25"/>
          <rect x="150" y="34" width="88" height="58" rx="25"/>
          <path d="M118 50 q16 -11 32 0"/>
          <path d="M30 52 q-15 -5 -22 -18"/>
          <path d="M238 52 q15 -5 22 -18"/>
        </g>
        <rect class="glass-lens" x="30" y="34" width="88" height="58" rx="25" fill="url(#ll-lens)"/>
        <rect class="glass-lens" x="150" y="34" width="88" height="58" rx="25" fill="url(#ll-lens)"/>
        <g class="glass-shine" fill="#fff">
          <ellipse cx="58" cy="52" rx="13" ry="8" transform="rotate(-26 58 52)"/>
          <ellipse cx="178" cy="52" rx="13" ry="8" transform="rotate(-26 178 52)"/>
        </g>
        <g class="glass-frame" fill="none" stroke="#66798a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="30" y="34" width="88" height="58" rx="25"/>
          <rect x="150" y="34" width="88" height="58" rx="25"/>
          <path d="M118 50 q16 -11 32 0"/>
          <path d="M30 52 q-15 -5 -22 -18"/>
          <path d="M238 52 q15 -5 22 -18"/>
        </g>
        <circle class="glass-led" cx="50" cy="36" r="5.5" fill="#ff9f7a"/>
      </svg>
      <span class="intro-doodle a">&#10084;&#xFE0E;</span>
      <span class="intro-doodle b">&#10047;</span>
      <span class="intro-doodle c">&#10022;</span>
      <span class="intro-doodle d">&#10023;</span>
    </div>
    <div class="intro-word"><b>LIFELENS</b><i>바라본 순간, 흩어진 일상이 하나의 이야기가 되다.</i></div>

function render() {
  syncChrome(page);
  if (restoreCachedPage(page)) return;
  if (page === 'home') home(); else if (page === 'stream') stream(); else if (page === 'lifelog') lifeLog(); else if (page === 'iot') iot(); else if (page === 'intro') intro(); else debug();
}
document.querySelectorAll('.bottom button').forEach((button) => button.onclick = () => setPage(button.dataset.page));
document.querySelector('.brand-back')?.addEventListener('click', () => window.handleNativeBack());
window.setPage = setPage;
// --- seed the floating bubbles in the living background ---
(() => {
  const field = document.querySelector('.bg-sparks');
  if (!field) return;
  const fragment = document.createDocumentFragment();
  for (let index = 0; index < 20; index += 1) {
    const bubble = document.createElement('i');
    const size = 4 + Math.round(Math.random() * 11);
    bubble.style.width = `${size}px`;
    bubble.style.height = `${size}px`;
    bubble.style.left = `${Math.random() * 100}%`;
    bubble.style.bottom = `${-8 - Math.random() * 12}%`;
    // Bigger bubbles rise a little faster, the way they actually do.
    bubble.style.animationDuration = `${26 - size * 0.7 + Math.random() * 10}s`;
    bubble.style.animationDelay = `${-Math.random() * 26}s`;
    bubble.style.opacity = String(0.35 + Math.random() * 0.45);
    fragment.appendChild(bubble);
  }
  field.appendChild(fragment);
})();

render();
refreshVisionState();

// Poll the native vision bridge only while the app is actually on screen.
let visionTimer = window.setInterval(refreshVisionState, 1200);
document.addEventListener('visibilitychange', () => {
  window.clearInterval(visionTimer);
  if (document.hidden) return;
  refreshVisionState();
  visionTimer = window.setInterval(refreshVisionState, 1200);
});

</script>
